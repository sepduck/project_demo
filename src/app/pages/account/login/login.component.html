<account-form [headerTitle]="'Đăng nhập'">
  <form-input placeholder="Email" [(value)]="email" [error]="errors.email!" isInput="no-label" />
  <form-input placeholder="Mật khẩu" [(value)]="password" [error]="errors.password!" type="password"
    isInput="no-label-password" />

  <re-captcha *ngIf="useCaptchaOnLogin" #captchaRef siteKey="6LdSNCwrAAAAAHEIqV1izQYp74bOx41VAiyFsaPV"
    (resolved)="onCaptchaResolved($event)" class="mt-3 mb-3 d-block"></re-captcha>

  <p-button severity="success" (click)="login()" styleClass="w-100 mt-3"
    [label]="isSubmitting ? 'Đang xử lý...' : 'Đăng nhập'" [disabled]="isSubmitting"></p-button>

  <ng-template #loadingTpl>
    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
    Đang xử lý...
  </ng-template>

  <div class="text-center mt-3">
    <p class="divider-text">
      <span class="bg-light">hoặc</span>
    </p>
    <button pButton type="button" severity="secondary" class="w-100" [raised]="true"
      (click)="loginWithOAuth('google', 'false')">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="24" height="24" />
      <span class="text-body">Đăng nhập với Google</span>
    </button>
    <button pButton type="button" severity="info" class="w-100 mt-3" [raised]="true"
      (click)="loginWithOAuth('facebook', 'false')">
      <img src="https://www.svgrepo.com/show/303112/facebook-icon-white-logo.svg" alt="Facebook" width="24"
        height="24" />
      <span class="text-white">Đăng nhập với Facebook</span>
    </button>

  </div>
  <div>
    <div class="mt-3">Bạn chưa phải là thành viên?</div>
    <a href="account/register" class="text-decoration-none" *ngIf="selfRegister">Tạo tài khoản</a> |
    <a href="account/email-validation" class="text-decoration-none">Kích hoạt email</a>
  </div>
</account-form>
