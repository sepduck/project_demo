
<account-form [headerTitle]="'Thay đổi mật khẩu'">
    <form-input placeholder="Mật khẩu" [(value)]="password" isInput="no-label" [error]="errors.password!" type="password"/>
    <form-input placeholder="Nhập lại mật khẩu" [(value)]="confirmPassword" isInput="no-label" [error]="errors.confirmPassword!" type="password"/>

    <form-button (backClick)="goToLogin()" (submitClick)="createNewPassword()" />
</account-form>
