<div class="w-100 px-4">
    <form class="space-y-4">
        <form-input label="Mật khẩu hiện tại" placeholder="Nhập mật khẩu hiện tại" [(value)]="currentPassword" [error]="errors.currentPassword!"
            isInput="col-password"/>
        <form-input label="Mật khẩu mới" placeholder="Nhập mật khẩu mới" [(value)]="newPassword" [error]="errors.newPassword!"
            isInput="col-password" />
        <form-input label="Nhập lại mật khẩu" placeholder="Nhập lại mật khẩu" [(value)]="confirmPassword" [error]="errors.confirmPassword!"
            isInput="col-password" />
    </form>
</div>

<div class="d-flex justify-content-end mt-5 px-4 mb-3">
    <p-button [label]="'Hủy bỏ'" icon="pi pi-times" severity="secondary" (onClick)="onCancelEmit()"
        class="w-1/3 p-button-rounded me-2" />
    <p-button (click)="changePassword()" [label]="'Lưu thông tin'" [disabled]="isSubmitting" icon="pi pi-save"
        severity="success" class="w-1/3 p-button-rounded" />
</div>
