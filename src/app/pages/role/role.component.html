<form-view [headerTitle]="'Vai trò'" [description]="'Sử dụng vai trò để nhóm quyền.'"
    [hasPermission]="authService.hasPermission('admin.role.create')" [labelBtn]="'Tạo vai trò mới'"
    (onCreatePage)="openCreateModal()">
    <p-panel styleClass="mt-3 mb-5">
        <div class="d-flex justify-content-between" *ngIf="false">
            <button type="button" class="btn btn-primary"><i class="bi bi-arrow-repeat me-2"></i>Làm tươi</button>
        </div>
        <div class="card mt-2">
            <p-table [value]="roles" [paginator]="true" [rows]="pageSize" [first]="(pageNumber - 1) * pageSize"
                [totalRecords]="totalRecords" [lazy]="true" (onLazyLoad)="onPageChange($event)"
                [rowsPerPageOptions]="[5, 10, 25, 50, 100, 250, 500]">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 170px;" class="text-center">Hành động</th>
                        <th>Tên vai trò</th>
                        <th>Thời gian tạo mới</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-role>
                    <tr>
                        <td class="text-center">
                            <ng-container *ngIf="!role.systemReserve; else reservedIcon">
                                <div class="dropdown">
                                    <p-button icon="pi pi-cog" label="Hành động" severity="info" id="dropdownMenuButton"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                    </p-button>
                                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                        <li>
                                            <button class="dropdown-item" (click)="openEditModal(role.id)">Chỉnh
                                                sửa</button>
                                        </li>
                                        <li>
                                            <button class="dropdown-item" (click)="deleteRole(role.id)">Xóa bỏ</button>
                                        </li>
                                    </ul>
                                </div>
                            </ng-container>

                            <ng-template #reservedIcon>
                                <i class="bi bi-lock-fill"></i>
                            </ng-template>
                        </td>
                        <td>
                            {{ role.name }}
                            <p-badge *ngIf="role.systemReserve" value="Tĩnh" severity="info" styleClass="ms-3">
                            </p-badge>
                            <span *ngIf="role.status" style="font-size: 0.7rem; font-weight: 600;" class="ms-3">Mặc
                                định</span>
                        </td>
                        <td>{{ role.createdAt | date:'HH:mm:ss dd/M/yyyy' }}</td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="paginatorleft">
                    <div class="flex align-items-center justify-content-between w-full">
                        <span>Page {{pageNumber}} of {{totalPages}}</span>
                    </div>
                </ng-template>
            </p-table>
        </div>
    </p-panel>
</form-view>

<!-- Modal -->
<p-dialog header="Edit Profile" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
</p-dialog>
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel" style="font-size: 1.1rem;">
                    {{ isEditMode ? 'Chỉnh sửa vai trò' : 'Tạo vai trò mới' }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link" [class.active]="activeTab === 'tab1'" (click)="setActiveTab('tab1')">Tên vai
                            trò</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [class.active]="activeTab === 'tab2'"
                            (click)="setActiveTab('tab2')">Quyền</a>
                    </li>
                </ul>

                <div class="tab-content mt-3">
                    <div class="tab-pane fade show active container" *ngIf="activeTab === 'tab1'">
                        <form-input label="Tên vai trò" [(value)]="newRole.name" [error]="errors.name!" isInput="label"
                            type="email" />
                        <div class="custom-checkbox-container d-flex align-items-center gap-1 mt-3">
                            <input class="custom-checkbox-input" type="checkbox" id="isDefault"
                                [(ngModel)]="newRole.status" [ngClass]="{'checked': newRole.status}">
                            <label class="custom-checkbox-label me-2" style="color: #99a187;" for="isDefault">
                                Mặc định
                            </label>
                            <p class="mb-0" style="color: #99a187; font-size: 0.9rem;">
                                (Mặc định gán cho tài khoản được tạo mới)
                            </p>
                        </div>

                        <div style="padding: 10px; border: 1px solid #f6c000; background-color: #fff8dd; color: #f6c215; border-radius: 10px;"
                            class="mt-5 mb-3">
                            <p>{{description}}</p>
                        </div>
                    </div>

                    <div class="tab-pane fade show active container" *ngIf="activeTab === 'tab2'">
                        <div class="container mt-4">
                            <div class="card">
                                <p-tree [value]="permissionTree" selectionMode="checkbox" styleClass="w-full md:w-full"
                                    [(selection)]="selectedPermissions" (onNodeSelect)="nodeSelect($event)"
                                    (onNodeUnselect)="nodeUnselect($event)">
                                </p-tree>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <p-button [label]="'Hủy bỏ'" icon="pi pi-save" severity="secondary" data-bs-dismiss="modal" />
                <p-button (onClick)="saveRole()" [label]="isEditMode ? 'Cập nhật thông tin' : 'Lưu thông tin'"
                    icon="pi pi-save" severity="info" />
            </div>
        </div>
    </div>
</div>
