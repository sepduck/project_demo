<div class="d-flex justify-content-center align-items-center mt-4"
    *ngIf="authService.hasPermission('mgmt.user.create')">
    <div style="width: 60vw; max-width: 1000px; padding: 30px; border-radius: 10px;" class="mb-5 bg-element-color">
        <h5 style="font-size: 1.3rem;">Tạo người dùng mới</h5>
        <p-tabs [(value)]="activeTab">
            <p-tablist>
                <p-tab value="0" class="custom-bold-tab">Thông tin người dùng</p-tab>
                <p-tab value="1" class="custom-bold-tab">Vai trò</p-tab>
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel value="0">

                    <div class="mt-3 row">
                        <div class="col-md-3 mt-2">
                            <label for="password" style="font-weight: 500;">Ảnh đại diện</label>
                        </div>
                        <div class="col-md-9">
                            <div class="image-form" (click)="onImageClick()">
                                <ng-container *ngIf="previewImageUrl else placeholder">
                                    <img [src]="previewImageUrl || placeholder"
                                        style="width: 100%; height: 100%; border-radius: 10%; object-fit: cover;"
                                        alt="profile image" />
                                </ng-container>

                                <ng-template #placeholder>
                                    <i class="pi pi-plus text-color" style="font-size: 1.5rem;"></i>
                                </ng-template>
                            </div>

                            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" hidden />

                            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" hidden />
                        </div>
                        <div class="col-md-3 mt-2"></div>
                        <div class="col-md-9 mt-2">
                            <i class="text-muted" style="font-size: 13px;">
                                *Dung lượng ảnh tối đa khuyến nghị: 5MB
                            </i>
                        </div>
                    </div>
                    <form-input label="Họ" placeholder="Nhập họ" [(value)]="firstName" [error]="errors.firstName!"
                        isInput="col" [required]="true" requiredTooltip="Họ phải tối thiểu 2 - 50 ký tự" />
                    <form-input label="Tên" placeholder="Nhập tên" [(value)]="lastName" [error]="errors.lastName!"
                        isInput="col" [required]="true" requiredTooltip="Tên phải tối thiểu 2 - 50 ký tự" />
                    <form-input label="Địa chỉ Email" placeholder="Nhập địa chỉ email" [(value)]="email"
                        [error]="errors.email!" isInput="col" type="email" [required]="true" />
                    <form-input label="Số điện thoại" placeholder="Nhập số điện thoại" [(value)]="phoneNumber"
                        [error]="errors.phone!" isInput="col" type="phoneNumber" [required]="true" />
                    <form-input label="Tên truy cập" placeholder="Nhập tên truy cập" [(value)]="username"
                        [error]="errors.username!" isInput="col" [required]="true" />

                    <div>
                        <div *ngIf="!isRandomPassword">
                            <form-input label="Mật khẩu" [(value)]="password" [error]="errors.password!"
                                isInput="col-password" [required]="true" />
                            <form-input label="Xác nhận mật khẩu" [(value)]="confirmPassword"
                                [error]="errors.confirmPassword!" isInput="col-password" [required]="true" />
                        </div>


                        <div class="d-flex items-center gap-2 mt-5">
                            <p-toggleswitch [(ngModel)]="isRandomPassword" inputId="isRandomPassword" binary="true" />
                            <label for="isRandomPassword">Đặt mật khẩu ngẫu nhiên.</label>
                        </div>
                    </div>

                    <div class="d-flex items-center gap-2 mt-2">
                        <p-toggleswitch [(ngModel)]="isAction" inputId="isAction" binary="true" />
                        <label for="isAction">Kích hoạt</label>
                    </div>
                    <div class="d-flex items-center gap-2 mt-2">
                        <p-toggleswitch [(ngModel)]="isSendEmail" inputId="isSendEmail" binary="true" />
                        <label for="isSendEmail">Gửi email kích hoạt.</label>
                    </div>
                    <div class="d-flex items-center gap-2 mt-2">
                        <p-toggleswitch [(ngModel)]="mustChangePassword" inputId="mustChangePassword" binary="true" />
                        <label for="mustChangePassword">Cần thay đổi mật khẩu vào lần đăng nhập tiếp theo.</label>
                    </div>
                    <div class="d-flex items-center gap-2 mt-2" *ngIf="false">
                        <p-toggleswitch [(ngModel)]="isLockedOut" inputId="isLockedOut" binary="true" />
                        <label for="isLockedOut">Khóa tài khoản</label>
                    </div>
                    <div *ngIf="errorMessage" class="alert alert-danger mt-3">
                        {{ errorMessage }}
                    </div>
                </p-tabpanel>
                <p-tabpanel value="1">
                    <div class="row g-3 mt-2">
                        <div *ngFor="let role of rolesSelect"
                            class="col-sm-12 col-md-4 d-flex align-items-center gap-2 mt-3">
                            <p-checkbox [(ngModel)]="role.isSelected" binary="true" [inputId]="'role-' + role.id"
                                (ngModelChange)="onRoleChange()">
                            </p-checkbox>
                            <label [htmlFor]="'role-' + role.id" class="role-label-text">
                                {{ role.name }}
                            </label>
                        </div>
                    </div>
                    <div *ngIf="errorMessage" class="alert alert-danger mt-3">
                        {{ errorMessage }}
                    </div>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>

        <div class="d-flex justify-content-end gap-2 mt-5">
            <p-button [label]="'Hủy bỏ'" icon="pi pi-times" severity="secondary" (click)="cancel()" />
            <p-button (click)="saveUser()" [label]="isSubmitting ? 'Đang xử lý...' : 'Lưu thông tin'"
                [disabled]="isSubmitting" icon="pi pi-save" severity="success" />
        </div>
    </div>
</div>
