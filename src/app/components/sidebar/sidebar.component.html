<div class="d-flex" [ngClass]="{ 'collapsed': isCollapsed }">
    <!-- Sidebar -->
    <div class="sidebar bg-dark text-white p-3">
        <img [src]="isCollapsed ? '/svg/app-logo-on-light-sm.svg' : '/svg/app-logo-on-light.svg'" style="height: 25px;"
            alt="logo" />

        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a [routerLink]="['/app/admin/dashBoard']" class="nav-link text-white" *ngIf="authService.hasPermission('dashboard')">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white d-flex justify-content-between align-items-center"
                    (click)="toggleSubMenu()" *ngIf="authService.hasPermission('mgmt')">
                    Quản trị
                    <i class="bi" [ngClass]="{ 'bi-chevron-down': !isSubMenuOpen, 'bi-chevron-up': isSubMenuOpen }"></i>
                </a>
                <ul class="nav flex-column ms-3" *ngIf="isSubMenuOpen">
                    <li *ngIf="authService.hasPermission('mgmt.role')" class="nav-item"><a
                            [routerLink]="['/app/admin/roles']" class="nav-link text-white">Vai trò</a>
                    </li>
                    <li *ngIf="authService.hasPermission('mgmt.user')" class="nav-item"><a
                            [routerLink]="['/app/admin/users']" class="nav-link text-white">Người
                            dùng</a></li>
                    <li *ngIf="authService.hasPermission('mgmt.activity')" class="nav-item"><a
                            [routerLink]="['/app/admin/auditLogs']" class="nav-link text-white">Nhật ký
                            kiểm tra</a></li>
                    <li *ngIf="authService.hasPermission('mgmt.setting')" class="nav-item"><a
                            [routerLink]="['/app/admin/tenantSettings']" class="nav-link text-white">Cài
                            đặt</a></li>
                </ul>
            </li>
        </ul>
    </div>
</div>
